name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run release contract
        run: python3 tools/release_check.py

  wordpress-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.7.7'
            php: '7.4'
          - wordpress: '7.1'
            php: '8.3'
          - wordpress: '7.1'
            php: '8.4'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: wp-cli

      - name: Install WordPress
        env:
          WP_PATH: ${{ runner.temp }}/wordpress
        run: |
          mkdir -p "$WP_PATH"
          wp core download --path="$WP_PATH" --version="${{ matrix.wordpress }}" --force
          wp config create --path="$WP_PATH" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path="$WP_PATH" --url=http://popped.test --title=Popped --admin_user=admin --admin_password=password --admin_email=admin@example.test --skip-email
          mkdir -p "$WP_PATH/wp-content/plugins/popped"
          rsync -a --delete --exclude='.git/' "$GITHUB_WORKSPACE/" "$WP_PATH/wp-content/plugins/popped/"

      - name: Activate Popped
        env:
          WP_PATH: ${{ runner.temp }}/wordpress
        run: wp plugin activate popped --path="$WP_PATH"

      - name: Run WordPress smoke suite
        env:
          WP_PATH: ${{ runner.temp }}/wordpress
        run: wp eval-file "$WP_PATH/wp-content/plugins/popped/tools/wordpress_smoke.php" --path="$WP_PATH"

  browser-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run WordPress Playwright suite
        run: npm run test:e2e -- --project=chromium

  plugin-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './'
          wp-version: '7.1'
          include-experimental: 'false'
